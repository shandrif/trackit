<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trackit · Baladiya Card Tracker</title>
<meta name="description" content="Track staff Baladiya health card renewals across Half Million stores.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://rcufmnidwyycbrtqgqga.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-title" content="Trackit">
<style>
:root{
  --bg:#F5EDE3; --card:#FFFDF9; --ink:#111111; --muted:#6E655B; --line:#E4D7C5;
  --tan:#D4B38B; --tan-d:#A9875F; --teal:#84C6B2; --teal-d:#2F8A72;
  --red:#C2412D; --red-bg:#F8E1DB; --amber:#A8691C; --amber-bg:#F7E6CC; --ok-bg:#DDF0EA;
  --radius:16px; --shadow:0 1px 0 rgba(17,17,17,.04),0 8px 24px -12px rgba(80,56,30,.18);
  --font:"Frutiger LT Arabic","Frutiger LT","Frutiger","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
/* logo */
.logo{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.5px;flex:none}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-size:20px;letter-spacing:-.3px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 30px;box-shadow:var(--shadow)}
.login-card h1{font-size:26px;margin:22px 0 6px;letter-spacing:-.4px}
.login-card p{color:var(--muted);margin:0 0 22px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--tan-d);box-shadow:0 0 0 3px rgba(212,179,139,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 18px;font-weight:600;cursor:pointer;min-height:44px;background:var(--ink);color:var(--bg);white-space:nowrap}
.btn:hover{background:#2a2622}
.btn.tan{background:var(--tan);color:var(--ink)} .btn.tan:hover{background:#c9a476}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.w100{width:100%}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
/* shell */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--ink);color:var(--bg);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside .logo{background:var(--bg);color:var(--ink)}
aside .brand small{color:#bfb3a3}
nav{margin-top:26px;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#d9cfc2;padding:11px 12px;border-radius:11px;cursor:pointer;text-align:left;font-weight:500}
nav button:hover{background:#26221e;color:#fff}
nav button.on{background:var(--tan);color:var(--ink);font-weight:700}
nav button svg{width:19px;height:19px;flex:none}
nav .sep{font-size:11px;letter-spacing:.12em;color:#8f8476;margin:16px 12px 4px;text-transform:uppercase}
.me{margin-top:auto;border-top:1px solid #2c2722;padding-top:14px;font-size:13px}
.me b{display:block;color:#fff;font-size:14px}
.me span{color:#bfb3a3}
.me button{margin-top:10px;background:transparent;border:1px solid #3a342e;color:#d9cfc2;border-radius:9px;padding:7px 12px;cursor:pointer}
main{padding:28px 32px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h2{margin:0;font-size:28px;letter-spacing:-.5px}
.top p{margin:4px 0 0;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--teal-d);background:var(--ok-bg);padding:5px 10px;border-radius:999px;font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:var(--teal-d);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:18px 20px;cursor:pointer;transition:transform .12s}
.kpi:hover{transform:translateY(-2px)}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .v{font-size:38px;font-weight:700;letter-spacing:-1px;margin-top:6px;line-height:1}
.kpi .s{font-size:12px;color:var(--muted);margin-top:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
h3{margin:0 0 14px;font-size:17px}
.bar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:#efe5d8;margin:6px 0 12px}
.bar span{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink)}
/* table */
.tbl-wrap{overflow:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:#FBF6EF;position:sticky;top:0;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #EFE5D8;vertical-align:middle}
tr:last-child td{border-bottom:0}
td .sub{color:var(--muted);font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-exp{background:var(--red-bg);color:var(--red)} .p-due{background:var(--amber-bg);color:var(--amber)} .p-ok{background:var(--ok-bg);color:var(--teal-d)}
.icon-btn{background:transparent;border:0;border-radius:8px;padding:6px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:#f1e7da;color:var(--ink)}
.icon-btn svg{width:17px;height:17px;display:block}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters > *{flex:1 1 160px;max-width:260px}
.filters input[type=search]{flex:2 1 240px;max-width:none}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);gap:10px;flex-wrap:wrap}
.empty{padding:42px 20px;text-align:center;color:var(--muted)}
.tabs{display:inline-flex;background:#EADFD0;border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.step-n{width:34px;height:34px;border-radius:10px;background:var(--tan);display:grid;place-items:center;font-weight:700;margin-bottom:12px}
.drop{border:2px dashed var(--tan);border-radius:14px;padding:26px;text-align:center;background:#FBF6EF;cursor:pointer}
.drop.over{background:#f3e6d4}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.summary div{background:#FBF6EF;border-radius:12px;padding:12px;text-align:center}
.summary b{display:block;font-size:24px}
.errlist{max-height:240px;overflow:auto;font-size:13px;background:var(--red-bg);border-radius:12px;padding:12px 14px;color:#7a2a1d}
.note{font-size:13px;color:var(--muted)}
code{background:#EFE5D8;padding:1px 6px;border-radius:6px;font-size:12.5px}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 170px);min-height:420px}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:12px 15px;border-radius:14px;white-space:normal}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#FBF6EF;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a ul{margin:6px 0;padding-left:20px}
.msg.a p{margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;font-size:13px}
.chips button:hover{border-color:var(--tan-d)}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.typing{color:var(--muted);font-size:13px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:100%;max-width:480px;background:var(--card);border-radius:20px;padding:24px;max-height:92vh;overflow:auto}
.modal h3{font-size:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;font-weight:600;box-shadow:var(--shadow)}
.mobile-top,.bottom-nav{display:none}
.sm-only{display:none}
.sub.sm-only{display:none}
td.mono{white-space:nowrap}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:18px 16px 96px}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--ink);color:var(--bg);position:sticky;top:0;z-index:20}
  .mobile-top .logo{background:var(--bg);color:var(--ink);width:34px;height:34px;font-size:13px}
  .mobile-top button{background:transparent;border:1px solid #3a342e;color:#d9cfc2;border-radius:9px;padding:6px 10px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottom-nav button{background:transparent;border:0;color:#bfb3a3;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;padding:6px 4px;border-radius:10px;flex:1;cursor:pointer}
  .bottom-nav button.on{color:var(--tan)}
  .bottom-nav svg{width:21px;height:21px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.steps{grid-template-columns:1fr}
  .kpi .v{font-size:30px}
  .top h2{font-size:23px}
  .msg{max-width:92%}
  .summary{grid-template-columns:repeat(2,1fr)}
  .row2{grid-template-columns:1fr}
  .filters > *{max-width:none}
  .hm{display:none}
  .sm-only{display:inline}
  .sub.sm-only{display:block}
  td,th{padding:10px 10px}
  .chat{height:calc(100vh - 290px);min-height:360px}
  .pill{font-size:11px;padding:3px 8px}
}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.p-miss{background:#ECE6DE;color:#5C554C}
.prog{display:inline-flex;gap:4px;align-items:center}
.prog i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:#EFE5D8;color:#9b8f80}
.prog i.on{background:var(--teal);color:#0f3b30}
.prog i.na{background:#F3EEE7;color:#b9ad9e;text-decoration:line-through}
.funnel{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:150px 1fr 54px;gap:12px;align-items:center;font-size:14px}
.frow .track{height:14px;border-radius:999px;background:#efe5d8;overflow:hidden}
.frow .track span{display:block;height:100%;border-radius:999px}
.frow b{text-align:right;font-variant-numeric:tabular-nums}
.trend svg{width:100%;height:auto;display:block}
.seg{display:inline-flex;background:#EFE5D8;border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;color:var(--muted);font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.done{background:var(--teal);color:#0f3b30}
.steprow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EFE5D8;flex-wrap:wrap}
.steprow:last-child{border-bottom:0}
.modal.wide{max-width:640px}
.matchtbl td{padding:8px 10px}
.matchtbl select{min-height:38px;padding:7px 10px}
.okbox{background:var(--ok-bg);color:#1f5e4e;border-radius:12px;padding:12px 14px;font-size:13px}
.warnbox{background:var(--amber-bg);color:#6e4310;border-radius:12px;padding:12px 14px;font-size:13px}
.section{margin-top:16px}
.contact a{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--muted);text-decoration:none}
.contact a:hover{background:#f1e7da;color:var(--ink)}
.contact svg{width:17px;height:17px}
@media (max-width:900px){
  .kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .frow{grid-template-columns:110px 1fr 40px;font-size:13px}
  .modal.wide{max-width:100%}
  div.sm-only{display:block}
  td.mono{white-space:normal}
}
.live .off-txt{display:none}
.offline .live{background:#EFE5D8;color:#6E655B}
.offline .live i,.offline .live i::after{background:#9b8f80}
.offline .live .on-txt{display:none}
.offline .live .off-txt{display:inline}
a.btn{text-decoration:none}
img.logo{background:none!important;border-radius:24%;object-fit:cover;box-shadow:0 6px 16px -8px rgba(91,92,246,.55)}
.login-card img.logo{width:52px;height:52px}

/* ---------- splash (shows only while the app is loading) ---------- */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg);transition:opacity .32s cubic-bezier(.23,1,.32,1),visibility 0s .32s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-box{display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transform:scale(.92);animation:spIn .42s cubic-bezier(.23,1,.32,1) .15s forwards}
#splash.out .sp-box{transform:scale(1.04);transition:transform .32s cubic-bezier(.23,1,.32,1)}
#splash .sp-logo{width:84px;height:84px;border-radius:24%;box-shadow:0 14px 34px -14px rgba(91,92,246,.6);animation:spBreathe 1.8s ease-in-out .9s infinite}
#splash .sp-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw .45s cubic-bezier(.65,0,.35,1) forwards}
#splash .d1{animation-delay:.35s}#splash .d2{animation-delay:.48s}#splash .d3{animation-delay:.72s;animation-duration:.2s}#splash .d4{animation-delay:.78s}
#splash .sp-spin{transform-origin:366px 356px;animation:spSpin 1.4s cubic-bezier(.65,0,.35,1) 1.2s infinite}
#splash .sp-name{font-weight:700;font-size:20px;letter-spacing:-.2px;color:var(--ink)}
#splash .sp-bar{width:96px;height:3px;border-radius:3px;background:rgba(17,17,17,.08);overflow:hidden}
#splash .sp-bar i{display:block;width:40%;height:100%;border-radius:3px;background:var(--tan-d);animation:spBar 1.1s cubic-bezier(.65,0,.35,1) infinite}
@keyframes spIn{to{opacity:1;transform:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spBreathe{50%{transform:scale(1.035)}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spBar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){
  #splash .sp-box{animation:spFade .3s ease .15s forwards;transform:none}
  #splash .sp-logo,#splash .sp-spin,#splash .sp-bar i{animation:none}
  #splash .sp-draw{animation:none;stroke-dashoffset:0}
  #splash.out .sp-box{transform:none}
}
@keyframes spFade{to{opacity:1}}

/* ---------- fixed app frame: only the content area scrolls ---------- */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#shell:not(.hidden){height:100vh;height:100dvh;display:flex;flex-direction:column}
#shell #app{flex:1 1 auto;min-height:0;grid-template-rows:minmax(0,1fr)}
#shell aside{position:relative;top:auto;height:auto;overflow-y:auto}
#main{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#login,#noaccess{height:100vh!important;height:100dvh!important;min-height:0!important;overflow-y:auto;overscroll-behavior:contain}
@media (max-width:900px){
  #shell .mobile-top{position:relative;flex:none}
  #main .filters{top:10px}
}

/* ---------- card status ---------- */
.cs-chip{display:inline-block;max-width:100%;padding:3px 9px;border-radius:999px;background:#EAF5F1;color:#24705E;border:1px solid #CBE7DE;font-size:12px;font-weight:700;line-height:1.35;white-space:normal;margin:0 0 3px}
.cs-chip + .sub{display:block}
.sm-only-b{display:none;margin-top:4px}
.p-left{background:#E9E4DD;color:#6E655B}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:12px 18px 18px}
.cs-tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:14px;background:#FBF7F1;border:1px solid var(--line);transition:transform 160ms var(--ease-out,ease),border-color 160ms}
.cs-tile b{font-size:24px;line-height:1;color:var(--ink)}
.cs-tile span{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.cs-tile:hover{border-color:var(--tan)}
.cs-tile:active{transform:scale(.97)}
.cs-tile:focus-visible{outline:2px solid var(--tan-d);outline-offset:2px}
@media (max-width:900px){ .sm-only-b{display:block} .cs-grid{grid-template-columns:1fr 1fr;padding:10px 14px 14px} }

/* ---------- edit pop-up extras ---------- */
.actions.split{justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.btn.danger-t{color:var(--red)}
.linkbtn{all:unset;cursor:pointer;color:var(--tan-d);font-weight:700;font-size:13px}
.linkbtn:hover{text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--tan-d);outline-offset:2px;border-radius:4px}
.hist-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.hist{margin-top:10px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#FBF7F1}
.hist-row{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.hist-row:last-child{border-bottom:0}
.hist-row .old{color:var(--muted);text-decoration:line-through}
.photo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photo-pick{cursor:pointer}
.card-photo{display:block;margin-top:10px;max-width:100%;max-height:340px;border-radius:12px;border:1px solid var(--line)}
/* ---------- leavers ---------- */
.leaver-tools{margin:2px 0 10px;font-size:13px;color:var(--muted)}
.lv{width:18px;height:18px;accent-color:var(--ink)}
/* ---------- message a store ---------- */
.msg-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;margin-top:6px}
.msg-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#FBF7F1;transition:opacity 200ms,background-color 200ms}
.msg-row.sent{opacity:.55;background:#EEF7F3}
.msg-row.sent .wa-btn span::after{content:" ✓"}
.msg-who{min-width:0}
.msg-who .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.msg-who .cs-chip{margin:0}
.wa-btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.wa-btn svg{width:16px;height:16px}
/* ---------- printable report ---------- */
#report{display:none}
@media print{
  @page{size:A4;margin:14mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body.printing > *:not(#report){display:none!important}
  body.printing #report{display:block;color:#1D1B17;font-family:var(--font);font-size:11pt}
  #report .r-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:3px solid #D4B38B}
  #report .r-brand{display:flex;gap:10px;align-items:center}
  #report .r-brand img{width:38px;height:38px;border-radius:9px}
  #report .r-brand b{display:block;font-size:15pt}
  #report .r-brand span,#report .r-date{color:#5E574C;font-size:9.5pt}
  #report h1{font-size:22pt;margin:16px 0 2px}
  #report .r-sub{color:#5E574C;margin:0 0 14px}
  #report h2{font-size:12pt;margin:14px 0 5px}
  #report .r-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  #report .r-kpi{background:#F5EDE3;border-radius:10px;padding:10px 12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #report .r-l{font-size:9.5pt;color:#5E574C;font-weight:700}
  #report .r-v{font-size:22pt;font-weight:800}
  #report .r-v small{font-size:10pt;color:#5E574C;font-weight:600}
  #report .r-cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
  #report table{width:100%;border-collapse:collapse;font-size:9pt}
  #report .r-nw{white-space:nowrap}
  #report tr{break-inside:avoid}
  #report th{text-align:left;background:#D4B38B;padding:5px 7px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #report td{padding:4px 7px;border-bottom:1px solid #E4D7C5}
  #report .r-red{color:#C2412D;font-weight:700}
  #report .r-num{text-align:right;font-weight:700}
  #report .r-foot{margin-top:18px;color:#5E574C;font-size:8.5pt;border-top:1px solid #E4D7C5;padding-top:6px}
}

/* ---------- sign-in + unsaved changes ---------- */
.pw-wrap{position:relative}
.pw-wrap input{padding-right:64px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--tan-d);font-weight:700;font-size:13px;padding:8px 10px;border-radius:8px;cursor:pointer}
.pw-eye:focus-visible{outline:2px solid var(--tan-d)}
.unsaved{color:var(--amber);font-weight:600;margin:10px 0 0}

/* ---------- area manager / ROM mapping ---------- */
.grp-seg{display:inline-flex;flex-wrap:wrap;gap:4px;margin:18px 0 10px;padding:4px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid var(--line)}
.grp-seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.grp-seg button.on{background:var(--ink);color:var(--bg)}
.map-sec{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#FBF7F1}
.map-sec > summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}
.map-sec > summary::-webkit-details-marker{display:none}
.map-sec > summary::before{content:"▸ ";color:var(--tan-d)}
.map-sec[open] > summary::before{content:"▾ "}
.map-sec .tbl-wrap{max-height:480px;overflow:auto;border-top:1px solid var(--line)}
.map-sec select,.in-sm{min-width:0;width:100%;max-width:260px;padding:7px 9px;font-size:13px;border-radius:9px}
tr.unmapped td:first-child b{color:var(--red)}
@media (max-width:900px){ .grp-seg{display:flex} .grp-seg button{flex:1 1 auto} }
.xf{display:contents}
.more-f-btn{display:none}
@media (max-width:900px){
  .more-f-btn{display:inline-flex;justify-content:center;flex:1 1 100% !important;max-width:none !important}
  .xf{display:none}
  .xf.open{display:contents}
}
/* ---------- verification ---------- */
.p-unv{background:#EFEAE3;color:#7A6F62}
.vprog-card{margin-bottom:14px}
.vprog-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.vbar{height:10px;border-radius:99px;background:#ECE6DE;overflow:hidden}
.vbar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s}
.vbar.sm{height:6px;width:110px;display:inline-block;vertical-align:middle;margin-right:8px}
.vlist{display:grid;gap:10px}
.vrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;padding:14px 16px;transition:opacity .3s,transform .3s}
.vrow.gone{opacity:0;transform:translateX(20px)}
.vrow.done{grid-template-columns:1fr auto;align-items:center}
.vwho b{font-size:15px}
.vwho .sub{margin-top:2px}
.vid{display:flex;align-items:center;gap:10px;margin:6px 0 2px;font-size:15px}
.vid .mono{letter-spacing:.04em;font-weight:700}
.vcheck{margin-top:6px;font-size:12.5px;background:var(--amber-bg);color:#7A4A12;padding:6px 9px;border-radius:9px}
.vform{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;align-content:start}
.vform label{margin:0 0 3px;font-size:12px}
.vin input{width:100%}
.vform .chk,.vform .err,.vform .vbtns{grid-column:1/-1}
.vbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vres{text-align:right;display:grid;gap:3px;justify-items:end}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;margin:10px 0}
.chk input{width:18px;height:18px;flex:none}
.chk.sm{font-size:13px;margin:2px 0}
.hj{display:block}
.hj input{width:100%}
.hj-out{display:block;font-size:12px;min-height:15px;margin-top:2px}
.hj-out.ok{color:var(--teal-d);font-weight:700}
.hj-out.bad{color:var(--red)}
.file-notes{background:#F6F2EC;border-radius:12px;padding:10px 12px;font-size:13px;display:grid;gap:4px;margin-bottom:6px}
.fp-out{display:grid;gap:8px;margin-top:12px;max-height:46vh;overflow:auto}
.fp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.acc-v.hidden{display:none}
@media (max-width:760px){
  .vrow{grid-template-columns:1fr;gap:10px}
  .vrow.done{grid-template-columns:1fr}
  .vres{justify-items:start;text-align:left}
  .vbtns .btn:first-child{flex:1}
}
.balady-card{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;border:1px solid var(--tan)}
.balady-card .btn{white-space:nowrap}
@media (max-width:760px){.balady-card{flex-direction:column;align-items:stretch}.balady-card .btn{text-align:center}}
.req-card{border:1px solid var(--tan)}
.req-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.req-row:first-of-type{border-top:0}
.req-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){.req-row{flex-direction:column;align-items:stretch}.req-btns{justify-content:flex-start}}
/* ================= Trackit motion & glass layer =================
   Motion rules (after Emil Kowalski's animation standards):
   - UI motion < 300ms, strong ease-out, never ease-in, no bounce on a work dashboard
   - only transform + opacity animate; specific properties, never "transition: all"
   - frequent actions (tab switches, filters) get little motion; first-time moments get a little delight
   - hover motion only for mouse users; reduced-motion keeps fades, drops movement
*/
:root{
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --glass: rgba(255,253,249,.68);
  --glass-strong: rgba(255,253,249,.88);
  --glass-edge: rgba(255,255,255,.7);
  --glass-dark: rgba(17,17,17,.9);
  --shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 1px 2px rgba(80,56,30,.06), 0 12px 32px -14px rgba(80,56,30,.28);
  --shadow-lift: 0 1px 0 rgba(255,255,255,.7) inset, 0 2px 4px rgba(80,56,30,.06), 0 22px 44px -18px rgba(80,56,30,.38);
}

/* ---- ambient background (slow, decorative, off for reduced motion) ---- */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;opacity:.7}
.ambient i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,rgba(212,179,139,.55),rgba(212,179,139,0) 68%);}
.ambient i:nth-child(2){width:40vmax;height:40vmax;right:-10vmax;top:18vh;background:radial-gradient(circle,rgba(132,198,178,.42),rgba(132,198,178,0) 66%);}
.ambient i:nth-child(3){width:36vmax;height:36vmax;left:28vw;bottom:-18vmax;background:radial-gradient(circle,rgba(169,135,95,.32),rgba(169,135,95,0) 66%);}
@keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-8vmax,-6vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(-6vmax,-9vmax) scale(1.15)}}
#login,#noaccess,#shell,#modalRoot{position:relative;z-index:1}

/* ---- glass surfaces ---- */
.card{background:rgba(252,248,242,.94);border:1px solid var(--glass-edge);
  transition:transform 200ms var(--ease-out),box-shadow 200ms var(--ease-out)}
.kpi{position:relative;overflow:hidden;transition:transform 200ms var(--ease-out),box-shadow 200ms var(--ease-out)}
.kpi::after{content:"";position:absolute;inset:0;background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.7),transparent 60%);opacity:0;transition:opacity 200ms var(--ease-out);pointer-events:none}
.kpi.alarm .v{animation:alarm 1.6s ease-in-out 3}
@keyframes alarm{0%,100%{text-shadow:0 0 0 rgba(194,65,45,0)}50%{text-shadow:0 0 16px rgba(194,65,45,.45)}}
th{background:rgba(251,246,239,.85)}
.login-card{background:var(--glass-strong);border:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow-lift);
  animation:rise 300ms var(--ease-out) both}
aside{background:var(--glass-dark);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border-right:1px solid rgba(255,255,255,.06)}
.filters{position:sticky;top:10px;z-index:5;padding:10px;margin:0 -10px 14px;border-radius:16px;transition:background-color 200ms var(--ease-out),box-shadow 200ms var(--ease-out)}
.filters.stuck{background:rgba(245,237,227,.96);box-shadow:0 10px 30px -18px rgba(80,56,30,.4)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],select,textarea{
  background:rgba(255,255,255,.82);transition:border-color 150ms var(--ease-out),box-shadow 150ms var(--ease-out),background-color 150ms var(--ease-out)}
input:focus,select:focus,textarea:focus{background:#fff}

/* ---- sliding indicators (FLIP: transform only, no bounce) ---- */
nav{position:relative}
nav button{position:relative;z-index:1;transition:color 150ms var(--ease-out),background-color 150ms var(--ease-out)}
nav button.on{background:transparent}
.ind{position:absolute;left:0;top:0;z-index:0;border-radius:11px;pointer-events:none;transform-origin:0 0;will-change:transform}
.ind.go{transition:transform 220ms var(--ease-in-out)}
nav > .ind{background:var(--tan);box-shadow:0 6px 18px -6px rgba(212,179,139,.6)}
.tabs,.seg{position:relative}
.tabs button,.seg button{position:relative;z-index:1;transition:color 150ms var(--ease-out)}
.tabs button.on,.seg button.on{background:transparent;box-shadow:none}
.tabs > .ind,.seg > .ind{background:var(--card);box-shadow:0 2px 8px -2px rgba(80,56,30,.25);border-radius:9px}
.seg > .ind.done{background:var(--teal)}
.bottom-nav button{transition:color 150ms var(--ease-out),transform 200ms var(--ease-out)}
.bottom-nav button.on{transform:translateY(-2px)}
.bottom-nav button.on svg{filter:drop-shadow(0 4px 8px rgba(212,179,139,.55))}

/* ---- buttons ---- */
.btn{position:relative;overflow:hidden;isolation:isolate;transition:transform 160ms var(--ease-out),box-shadow 200ms var(--ease-out),background-color 150ms var(--ease-out)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.62)}
.btn.arrow::after{content:"→";display:inline-block;width:0;opacity:0;transform:translateX(-4px);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
.ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:2;transform:scale(.15);opacity:.9;
  background:radial-gradient(circle,var(--rc,rgba(255,255,255,.55)) 0 30%,transparent 64%);
  transition:transform 600ms var(--ease-out),opacity 600ms cubic-bezier(.5,0,.75,0)}
.ripple.ring{background:none;box-shadow:0 0 0 2px var(--rc,rgba(255,255,255,.6)) inset;transition-duration:700ms;transition-delay:50ms}
.ripple.go{transform:scale(1);opacity:0}
.kpi,.tabs button,.seg button,nav button,.bottom-nav button{overflow:hidden}
.icon-btn,.contact a{transition:transform 150ms var(--ease-out),background-color 150ms var(--ease-out),color 150ms var(--ease-out)}
.icon-btn:active,.contact a:active{transform:scale(.92)}
.chips button{transition:transform 160ms var(--ease-out),border-color 150ms var(--ease-out),background-color 150ms var(--ease-out)}

/* ---- tables ---- */
tbody tr{transition:background-color 120ms var(--ease-out)}
tbody tr td:first-child{box-shadow:inset 0 0 0 0 var(--tan);transition:box-shadow 150ms var(--ease-out)}
.pill{transition:transform 150ms var(--ease-out)}

/* ---- hover effects: mouse users only ---- */
@media (hover: hover) and (pointer: fine){
  .card:hover{box-shadow:var(--shadow-lift)}
  .kpi:hover{transform:translateY(-3px)}
  .kpi:hover::after{opacity:1}
  nav button:hover{background:rgba(255,255,255,.06)}
  .btn:not(.ghost):not(:disabled):hover{box-shadow:0 10px 22px -12px rgba(17,17,17,.55)}
  .btn:not(.ghost):not(.tan):not(.danger)::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 48%,transparent 66%);transform:translateX(-120%);transition:transform 450ms var(--ease-out)}
  .btn:not(.ghost):not(.tan):not(.danger):hover::before{transform:translateX(120%)}
  .btn.ghost:hover{background:rgba(255,255,255,.9);border-color:var(--tan)}
  .btn.arrow:hover::after{width:1em;opacity:1;transform:none}
  .icon-btn:hover{transform:scale(1.1)}
  .contact a:hover{transform:scale(1.12);color:var(--teal-d)}
  .chips button:hover{transform:translateY(-2px);background:#fff}
  tbody tr:hover{background:rgba(251,246,239,.9)}
  tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 0 var(--tan)}
  tr:hover .pill{transform:scale(1.04)}
  .drop:hover{border-color:var(--tan-d);background:rgba(251,246,239,.9)}
}

/* ---- entrances ---- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.enter > *{animation:rise 260ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 50ms)}
.enter.first tbody tr:nth-child(-n+8){animation:rise 240ms var(--ease-out) both;animation-delay:calc(120ms + var(--r,0) * 30ms)}
.reveal{opacity:0;transform:translateY(8px);transition:opacity 300ms var(--ease-out),transform 300ms var(--ease-out)}
.reveal.in{opacity:1;transform:none}

/* ---- skeleton ---- */
.skel{border-radius:14px;background:linear-gradient(100deg,rgba(234,223,208,.55) 30%,rgba(255,255,255,.75) 50%,rgba(234,223,208,.55) 70%);background-size:300% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

/* ---- toast (transition-based so it can be interrupted) ---- */
.toast{background:rgba(17,17,17,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  opacity:0;transform:translate(-50%,12px) scale(.97);transition:opacity 300ms ease,transform 300ms ease}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ---- modal: centred, fast scale-in from .96 ---- */
.modal-bg{background:rgba(17,17,17,.45);animation:fade 200ms var(--ease-out) both}
.modal{background:var(--glass-strong);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);
  box-shadow:0 30px 80px -30px rgba(40,28,15,.55);animation:pop 220ms var(--ease-out) both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* ---- live dot & upload ---- */
.live i{animation:none;position:relative}
.live i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--teal-d);animation:ping 2.4s var(--ease-out) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(2.6);opacity:0}}
.drop{transition:transform 200ms var(--ease-out),box-shadow 200ms var(--ease-out),background-color 200ms var(--ease-out),border-color 200ms var(--ease-out);background:rgba(251,246,239,.6)}
.drop.over{transform:scale(1.015);border-color:var(--teal-d);background:rgba(221,240,234,.7);box-shadow:0 0 0 6px rgba(132,198,178,.25),0 18px 40px -20px rgba(47,138,114,.5)}

/* ---- phone ---- */
@media (max-width:900px){
  .mobile-top{background:rgba(24,22,20,.97)}
  .bottom-nav{background:rgba(24,22,20,.97);border-top:1px solid rgba(255,255,255,.06)}
  .filters{top:66px}
  .ambient i{opacity:.4}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .kpis.k5 > :last-child{grid-column:span 2}
}

/* ---- reduced motion: keep fades, drop movement ---- */
@media (prefers-reduced-motion: reduce){
  .ambient,.ripple{display:none}
  .enter > *,.enter.first tbody tr,.login-card,.modal{animation-name:fade!important}
  .reveal{transform:none}
  .ind.go{transition:none}
  .kpi.alarm .v,.live i::after,.skel{animation:none}
  .toast,.toast.show{transform:translate(-50%,0)}
  .btn:active:not(:disabled),.bottom-nav button.on,.drop.over{transform:none}
}
</style>
</head>
<body>
<div id="splash" aria-label="Loading Trackit" role="status">
  <div class="sp-box">
    <svg class="sp-logo" viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C7B7"/><stop offset="1" stop-color="#5B5CF6"/></linearGradient>
        <mask id="spcut"><rect width="512" height="512" fill="#fff"/><circle cx="366" cy="356" r="110" fill="#000"/></mask>
      </defs>
      <rect width="512" height="512" rx="116" fill="url(#spg)"/>
      <g mask="url(#spcut)" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
        <rect x="104" y="124" width="268" height="250" rx="40"/><path d="M104 188h268"/>
      </g>
      <g fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
        <path d="M170 96v52M306 96v52"/>
        <path class="sp-draw d1" pathLength="1" d="M262 236l18 18 36-38"/>
        <g class="sp-spin"><path class="sp-draw d2" pathLength="1" d="M430 302A84 84 0 1 1 381 273"/><path class="sp-draw d3" pathLength="1" d="M364 250l26 24-26 25"/></g>
        <path class="sp-draw d4" pathLength="1" d="M330 358l24 24 44-46"/>
      </g>
      <g fill="#fff"><rect x="146" y="220" width="36" height="32" rx="9"/><rect x="202" y="220" width="36" height="32" rx="9"/><rect x="146" y="272" width="36" height="32" rx="9"/><rect x="202" y="272" width="36" height="32" rx="9"/></g>
      <circle cx="446" cy="334" r="10" fill="#fff"/>
    </svg>
    <div class="sp-name">Trackit</div>
    <div class="sp-bar"><i></i></div>
  </div>
</div>

<!-- LOGIN -->
<section id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <div class="brand"><img class="logo" src="icon.svg" alt="Trackit"><div><b>Trackit</b><small>Baladiya card tracker</small></div></div>
    <h1>Sign in</h1>
    <p>Use the email and password your admin gave you.</p>
    <label for="lemail">Email</label>
    <input id="lemail" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" required>
    <label for="lpass">Password</label>
    <div class="pw-wrap"><input id="lpass" type="password" autocomplete="current-password" required><button type="button" class="pw-eye" id="pwEye" aria-label="Show password" onclick="const i=$('#lpass'),s=i.type==='password';i.type=s?'text':'password';this.textContent=s?'Hide':'Show';this.setAttribute('aria-label',s?'Hide password':'Show password')">Show</button></div>
    <button class="btn w100" style="margin-top:20px" id="lbtn">Sign in</button>
    <div class="err" id="lerr" role="alert" aria-live="polite"></div>
    <p class="note" style="margin:6px 0 0">Forgot your password? Ask your admin to reset it.</p>
  </form>
</section>

<div id="noaccess" class="hidden" style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <div class="login-card"><div class="brand"><img class="logo" src="icon.svg" alt="Trackit"><div><b>Trackit</b></div></div>
  <h1>No access yet</h1><p>Your login works, but it hasn't been added to Trackit. Ask the admin to add you.</p>
  <button class="btn" onclick="signOut()">Sign out</button></div>
</div>

function loginError(err){
  const m = String(err?.message || err || ""), s = err?.status;
  if (/invalid login credentials/i.test(m)) return "Wrong email or password. Check for a typo, or ask your admin to reset your password.";
  if (/email not confirmed/i.test(m)) return "This login isn't activated yet. Ask your admin to add you again from the Users page.";
  if (s === 429 || /too many|rate limit/i.test(m)) return "Too many tries. Wait a minute, then try again.";
  if (!navigator.onLine || /failed to fetch|network|load failed|timeout/i.test(m)) return "No internet connection. Check your signal and try again.";
  return m || "Couldn't sign in. Please try again.";
}
$("#loginForm").addEventListener("submit", async e => {

  let error;
  try { ({ error } = await Promise.race([sb.auth.signInWithPassword({ email: $("#lemail").value.trim().toLowerCase(), password: $("#lpass").value }),
    new Promise(r => setTimeout(() => r({ error: { message: "timeout" } }), 20000))])); } catch (err) { error = err; }

  if (error) { $("#lerr").textContent = loginError(error); $("#lpass").select(); }
});

// ---------- data ----------
// pages of 1,000 rows, fetched 3 at a time in parallel (2,000+ staff arrive in one round trip)
async function pageAll(table, order){
  const rows = [], page = from => sb.from(table).select("*").order(order).order("id").range(from, from + 999);
  for (let from = 0; ; from += 3000) {
    const res = await Promise.all([page(from), page(from + 1000), page(from + 2000)]);
    for (const { data, error } of res) { if (error) { toast(error.message); return rows; } rows.push(...data); }
    if (res.some(r => (r.data || []).length < 1000)) return rows;
  }
}
// everything loads at the same time — one round trip instead of several in a row

// ---------- Hijri (Umm al-Qura) → Gregorian ----------
// Official Umm al-Qura calendar, built in so every phone and PC converts exactly the same way.
// One number per Hijri year from 1440: its 12 bits say which months have 30 days (first bit = Muharram).
const UQ_Y0 = 1440, UQ_START = Date.UTC(2018, 8, 11);   // 1 Muharram 1440 = 11 Sep 2018
const UQ = [1492, 2778, 1370, 2731, 1429, 1865, 1892, 2986, 1461, 694, 2646, 3370, 3733, 1834, 1877, 858, 2397, 1179, 2637, 3366, 3411];
const uqLen = (y, m) => 29 + ((UQ[y - UQ_Y0] >> (12 - m)) & 1);
function hijriParts(txt){
  const m = String(txt || "").trim().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).match(/^(\d{1,4})\D+(\d{1,2})\D+(\d{1,4})$/);
  if (!m) return null;
  const a = +m[1], b = +m[2], c = +m[3];
  return a > 1000 ? [a, b, c] : c > 1000 ? [c, b, a] : null;
}
function hijriToG(txt){
  const p = hijriParts(txt); if (!p) return "";
  const [y, mo, d] = p;
  if (y < UQ_Y0 || y >= UQ_Y0 + UQ.length || mo < 1 || mo > 12 || d < 1 || d > uqLen(y, mo)) return "";
  let days = d - 1;
  for (let yy = UQ_Y0; yy < y; yy++) for (let mm = 1; mm <= 12; mm++) days += uqLen(yy, mm);
  for (let mm = 1; mm < mo; mm++) days += uqLen(y, mm);
  return new Date(UQ_START + days * 86400000).toISOString().slice(0, 10);
}
const HMONTHS = ["Muharram","Safar","Rabi al-Awwal","Rabi al-Thani","Jumada al-Ula","Jumada al-Akhirah","Rajab","Shaban","Ramadan","Shawwal","Dhul Qadah","Dhul Hijjah"];
const WDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
// typing a Hijri date fills the normal date box next to it
function hjText(v){ const g = hijriToG(v); if (!g) return ""; const [y, m, d] = hijriParts(v); return `${d} ${HMONTHS[m - 1]} ${y} = ${WDAYS[new Date(g).getUTCDay()]} ${fmtDate(g)}`; }
function hijriInput(inp, dateId){
  const out = inp.parentElement.querySelector(".hj-out"), v = inp.value.trim(), g = v ? hijriToG(v) : "";
  if (!v) { out.textContent = ""; return; }
  if (g) { const di = document.getElementById(dateId); if (di) { di.value = g; di.dispatchEvent(new Event("change", { bubbles: true })); }
    const [y, m, d] = hijriParts(v); out.textContent = `${d} ${HMONTHS[m - 1]} ${y} = ${WDAYS[new Date(g).getUTCDay()]} ${fmtDate(g)}`; out.className = "hj-out ok"; }
  else { const p = hijriParts(v); out.className = "hj-out bad";
    out.textContent = !p ? "Type it like 1447-09-15 or 15/09/1447" : p[0] < UQ_Y0 || p[0] >= UQ_Y0 + UQ.length ? `Only years ${UQ_Y0}–${UQ_Y0 + UQ.length - 1} — check the year` : p[1] < 1 || p[1] > 12 ? "Month must be 1–12" : `${HMONTHS[p[1] - 1]} ${p[0]} has only ${uqLen(p[0], p[1])} days`; }

function shrinkImage(file){
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : bad(new Error("Couldn't read that picture.")), "image/jpeg", 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("That file isn't a picture Trackit can read. Use a JPG or PNG photo.")); };
    img.src = url;
  });
}

const normHead = h => String(h||"").toLowerCase().replace(/\s+/g," ").trim();
const HEAD = {
  employee_id: ["employee id","employee number","employee no","employee no.","emp no","emp id","staff id"],
  name: ["name","employee name","full name"],
  store: ["store / department","store","branch","store name","branch name","department","workplace"],
  iqama: ["iqama / national id","iqama number","iqama","iqama no","national id","id number"],
  job_role: ["job role","job title","position"],
  card_status: ["card status"],
  file_note: ["notes","note"],
  check_note: ["check needed"],
  nationality: ["nationality"],
  expiry: ["expiry date","expire date","expired date","expiration date","expiry","expire"],
  mobile: ["mobile number","phone number","mobile","phone","mobile no"],
  remarks: ["am remarks","am- remarks","am-remarks","remarks","remark","reamrk"],

function colIndex(head){ const idx = {}; for (const [k, names] of Object.entries(HEAD)) { idx[k] = head.findIndex(h => names.includes(h)); if (idx[k] < 0) idx[k] = head.findIndex(h => names.some(n => h.startsWith(n))); } return idx; }
const MONTH_IX = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
function validYMD(y, m, d){ const dt = new Date(Date.UTC(y, m-1, d)); return dt.getUTCFullYear() === y && dt.getUTCMonth() === m-1 && dt.getUTCDate() === d; }
const ymd = (y, m, d) => `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
function readDate(v){
  if (v === null || v === undefined || String(v).trim() === "") return { date:"", note:"Blank in file", unclear:false };
  if (v instanceof Date && !isNaN(v)) return check(v.getFullYear(), v.getMonth()+1, v.getDate(), String(v));
  if (typeof v === "number") { const d = XLSX.SSF.parse_date_code(v); return d ? check(d.y, d.m, d.d, String(v)) : { date:"", note:String(v), unclear:true }; }
  const s = String(v).trim(), u = s.toUpperCase();
  if (/^0+[-/ ]+(JAN|0+)[-/ ]+0+$/i.test(s)) return { date:"", note:s, unclear:false };
  if (/^(NOT\s*FOUND|N\/?A|NA|NOT\s*UPDATED|NONE|NIL|-+|PENDING|TBA|TBC)$/.test(u)) return { date:"", note:s, unclear:false };
  let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return check(+m[1], +m[2], +m[3], s);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/))) return check(fixYear(+m[3]), +m[2], +m[1], s);
  if ((m = s.match(/^([A-Za-z]{3,9})[\s\-.]*(\d{1,2})(?:st|nd|rd|th)?[\s,\-.]*(\d{2,4})$/))) { const mo = MONTH_IX[m[1].toLowerCase().slice(0,3)]; if (mo) return check(fixYear(+m[3]), mo, +m[2], s); }
  if ((m = s.match(/^(\d{1,2})(?:st|nd|rd|th)?[\s\-.]*([A-Za-z]{3,9})[\s,\-.]*(\d{2,4})$/))) { const mo = MONTH_IX[m[2].toLowerCase().slice(0,3)]; if (mo) return check(fixYear(+m[3]), mo, +m[1], s); }
  return { date:"", note:s, unclear:true };
  function fixYear(y){ return y < 100 ? 2000 + y : y; }
  function check(y, mo, d, raw){
    if (y >= 1400 && y <= 1500) return { date:"", note:`${raw} (Hijri? please check)`, unclear:true };
    if (!validYMD(y, mo, d) || y < 2015 || y > 2040) return { date:"", note:raw, unclear:true };
    return { date: ymd(y, mo, d), note:"", unclear:false };
  }
}
function normNationality(v){
  const u = String(v||"").toUpperCase().replace(/[^A-Z ]/g,"").trim(); if (!u) return "";
  const map = [[/^SAUDI/,"Saudi"],[/^BANGLA/,"Bangladeshi"],[/^IND(I)?AN|^INDIA/,"Indian"],[/^FILIP|^PHIL|^PHIP|^PILIP/,"Filipino"],[/^PAKIS/,"Pakistani"],[/^NEPAL/,"Nepali"],[/^EGYP/,"Egyptian"],[/^SUDAN/,"Sudanese"],[/^YEMEN/,"Yemeni"],[/^ERIT|^IRIT/,"Eritrean"],[/^SRI ?LANK/,"Sri Lankan"],[/^JORDAN/,"Jordanian"],[/^SYRI/,"Syrian"],[/^NONE$/,""]];
  for (const [re, n] of map) if (re.test(u)) return n;
  return "Other";
}
function normMobile(v){ return String(v||"").replace(/\D/g,"").replace(/^(00)?966/, "").replace(/^0+/, ""); }
async function readWorkbook(file){
  await needXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type:"array", cellDates:false });   // Excel day numbers are converted exactly (Date objects can drift a day)
  const rows = []; const sheets = [];
  for (const name of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:"", raw:true });
    let h = -1; for (let i = 0; i < Math.min(aoa.length, 8); i++) { const t = aoa[i].map(normHead); if (t.some(x => HEAD.name.includes(x)) && t.some(x => HEAD.employee_id.includes(x) || HEAD.iqama.includes(x))) { h = i; break; } }
    if (h < 0) { sheets.push({ name, rows:0, skipped:true }); continue; }
    const idx = colIndex(aoa[h].map(normHead));
    let n = 0;
    aoa.slice(h + 1).forEach((r, i) => {
      if (r.every(c => String(c).trim() === "")) return;
      const get = k => idx[k] >= 0 ? r[idx[k]] : "";
      const eid = String(get("employee_id")).trim().replace(/\.0$/, ""); const nm = String(get("name")).trim();
      if (!eid && !nm) return;
      if (nm === "Example Name" && /delete this example/i.test(String(get("remarks")))) return;
      const d = readDate(get("expiry"));
      const txt = k => String(get(k) ?? "").replace(/\s+/g," ").trim();
      rows.push({ where: `${name.trim()} row ${h + i + 2}`, employee_id: eid, name: nm.replace(/\s+/g," "), store: txt("store"),
        iqama: String(get("iqama")).replace(/\.0$/, "").replace(/\D/g, ""), nationality: normNationality(get("nationality")),
        mobile: normMobile(get("mobile")), expiry: d.date, expiry_note: d.note, unclear: d.unclear, remarks: txt("remarks"),
        job_role: txt("job_role"), card_status: txt("card_status"), file_note: txt("file_note"), check_note: txt("check_note") });
      n++;
    });
    sheets.push({ name, rows:n });
  }

}
const rowKey = r => r.iqama ? "iq:" + r.iqama : r.employee_id ? "no:" + r.employee_id : "nm:" + r.name.toUpperCase();
// a workplace in the file: store code, department or branch name (blank = Unassigned)
function knownPlace(p){ const u = String(p || "").trim().toUpperCase(); if (!u || u === "UNASSIGNED") return true;
  return !!S.map[u] || S.depts.some(d => d.toUpperCase() === u) || Object.values(S.map).some(m => m.branch.toUpperCase() === u); }
function analyse(rows){
  const byId = {}; rows.forEach((r, i) => { (byId[rowKey(r)] ??= []).push(i); });
  const exactDup = [], conflicts = [];
  for (const [id, ix] of Object.entries(byId)) {
    if (!id || ix.length < 2) continue;
    const sig = i => [rows[i].store.toUpperCase(), rows[i].expiry || rows[i].expiry_note, rows[i].name.toUpperCase()].join("|");
    if (new Set(ix.map(sig)).size === 1) exactDup.push(id); else conflicts.push({ id, rows: ix.map(i => rows[i]) });
  }
  return { exactDup, conflicts };
}

function md(t){
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\s)\*(?!\s)(.+?)\*(?=\s|$)/g, "$1$2").replace(/^#+\s*/gm, "").split(/\n/);
  let h = "", inList = false;
  for (const l of lines) { const m = l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if (m) { if (!inList) { h += "<ul>"; inList = true; } h += `<li>${m[1]}</li>`; } else { if (inList) { h += "</ul>"; inList = false; } if (l.trim()) h += `<p>${l}</p>`; } }
  return h + (inList ? "</ul>" : "");
}

  const synced = S.mapMeta?.synced_at ? fmtTS(S.mapMeta.synced_at) : "not yet";
  return `<div class="card pad section" id="mapCard"><h3>Branches</h3>
    <p class="note">Area manager and ROM come from the Span of Control file every Sunday (last sync: <b>${synced}</b>, ${branches.length} branches). Staff are linked to a branch by store code. City and region are kept here — correct them below and the sync won't overwrite them. Departments have no area manager and show under their own name.</p>

async function linkStore(sel){
  const store = sel.dataset.store.trim().toUpperCase(), code = sel.value; sel.disabled = true;
  const { error } = code ? await sb.from("trackit_store_alias").upsert({ store, code, set_by: S.me.full_name || S.me.email, set_at: new Date().toISOString() })
                         : await sb.from("trackit_store_alias").delete().eq("store", store);
  sel.disabled = false;
  if (error) return toast(error.message);
  if (code) S.alias[store] = code; else delete S.alias[store];
  mapCache = new Map(); toast(code ? "Store linked" : "Link removed"); render();
}
async function saveGeo(inp){
  const v = inp.value.replace(/\s+/g, " ").trim(), code = inp.dataset.code, f = inp.dataset.f;
  inp.disabled = true;
  const { error } = await sb.from("trackit_store_map").update({ [f]: v }).eq("code", code);
  inp.disabled = false;
  if (error) return toast(error.message);
  S.map[code][f] = v; inp.value = v; mapCache = new Map(); toast(`${f === "city" ? "City" : "Region"} saved`);
}

function pickAlert(btn, on){ const seg = btn.parentElement; seg.querySelectorAll("button").forEach(b => b.classList.remove("on","done")); btn.classList.add("on"); if (on) btn.classList.add("done"); $("#alertForm [name=email_enabled]").value = on ? "1" : ""; }
function readAlertForm(){
  const fd = Object.fromEntries(new FormData($("#alertForm")));
  const recipients = [...new Set(fd.recipients.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean))];
  const bad = recipients.filter(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
  return { bad, row: { email_enabled: !!fd.email_enabled, recipients, frequency: fd.frequency, weekday: +fd.weekday, send_hour: +fd.send_hour,
    sender_email: fd.sender_email.trim(), sender_name: fd.sender_name.trim() || "Trackit", updated_at: new Date().toISOString() } };
}
async function saveAlerts(quiet){
  const { bad, row } = readAlertForm(); $("#alertErr").textContent = "";
  if (bad.length) { $("#alertErr").textContent = "Not a valid email: " + bad.join(", "); return false; }
  if (row.email_enabled && !row.recipients.length) { $("#alertErr").textContent = "Add at least one receiver email."; return false; }
  if (row.email_enabled && !row.sender_email) { $("#alertErr").textContent = "Add the sender email you verified in Brevo."; return false; }
  const { error } = await sb.from("trackit_settings").update(row).eq("id", 1);
  if (error) { $("#alertErr").textContent = error.message; return false; }
  Object.assign(S.settings, row); if (!quiet) { toast("Email alerts saved"); render(); }
  return true;
}
async function testAlert(){
  const b = $("#alertTest"); b.disabled = true; b.textContent = "Sending…";
  if (!(await saveAlerts(true))) { b.disabled = false; b.textContent = "Send test email now"; return; }
  const { data, error } = await sb.functions.invoke("trackit-email", { body: { mode: "test" } });
  let msg = data?.error; if (!data?.ok && !msg && error?.context?.json) { try { msg = (await error.context.json()).error; } catch {} }
  await loadAdmin(); render();
  if (data?.ok) toast(`Test email sent to ${data.sent} receiver${data.sent === 1 ? "" : "s"}`);
  else { const e = $("#alertErr"); if (e) e.textContent = msg || error?.message || "Couldn't send"; }
}

// who a login can see: everything, one area manager's stores, one store, or one department
function accessFields(role, kind, val){
  const k = role === "admin" ? "admin" : kind || "all";
  const ams = [...new Set(Object.values(S.map).map(m => m.area_manager).filter(Boolean))].sort();
  const br = Object.values(S.map).sort((x, y) => x.branch.localeCompare(y.branch));

  return `<label>Sees</label><select name="acc" onchange="document.querySelectorAll('.acc-v').forEach(d => d.classList.toggle('hidden', d.dataset.k !== this.value))">
      ${[["store","One store"],["dept","One department"],["am","An area manager's stores"],["all","All employees"],["admin","Admin — everything, plus users and import"]].map(([v, l]) => `<option value="${v}" ${k === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    ${box("store", `<label>Store</label><select name="v_store"><option value="">— pick —</option>${br.map(b => `<option value="${esc(b.code)}" ${k === "store" && val === b.code ? "selected" : ""}>${esc(b.branch)} (${esc(b.code)})</option>`).join("")}</select>`)}
    ${box("dept", `<label>Department</label><select name="v_dept"><option value="">— pick —</option>${S.depts.map(d => `<option ${k === "dept" && val === d ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>`)}
    ${box("am", `<label>Area manager</label><select name="v_am"><option value="">— pick —</option>${ams.map(a => `<option ${k === "am" && val === a ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>`)}`;

function readAccess(fd){
  const a = fd.acc || "all";
  if (a === "admin") return { role: "admin", scope_kind: "all", scope_value: "" };
  if (a === "all") return { role: "manager", scope_kind: "all", scope_value: "" };
  const v = fd["v_" + a] || ""; if (!v) return { error: "Pick which " + ({ store: "store", dept: "department", am: "area manager" }[a]) + " this login sees." };
  return { role: "manager", scope_kind: a, scope_value: v };
}

const genPw = () => { const c = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789", a = new Uint32Array(10); crypto.getRandomValues(a); return [...a].map(x => c[x % c.length]).join(""); };

const slug = t => String(t).toLowerCase().replace(/&/g, " ").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function unitsWithoutLogin(){
  const has = (k, v) => S.profiles.some(p => p.role !== "admin" && p.scope_kind === k && p.scope_value === v);
  const st = [...new Set(S.emps.filter(e => e.unit_kind === "store").map(e => e.unit))].filter(c => S.map[c] && !has("store", c)).sort((x, y) => x.localeCompare(y, undefined, { numeric: true }))
    .map(c => ({ kind: "store", value: c, full_name: `${S.map[c].branch} (${c})` }));
  const dp = S.depts.filter(d => S.emps.some(e => e.unit_kind === "dept" && e.unit === d) && !has("dept", d)).map(d => ({ kind: "dept", value: d, full_name: d }));
  return [...st, ...dp];
}
function bulkLogins(){
  const todo = unitsWithoutLogin(); if (!todo.length) return;
  const nS = todo.filter(t => t.kind === "store").length, nD = todo.length - nS;
  modal(`<h3>Create logins</h3><p class="note" style="margin-top:-6px">One login for each of <b>${nS} stores</b>${nD ? ` and <b>${nD} departments</b>` : ""} that have staff and no login yet. Each one sees only its own staff. Passwords are made up at random and kept here so you can <b>Download logins (Excel)</b> any time to share them.</p>
    <form id="bf"><label>Email ending</label><input type="text" name="domain" value="trackit.halfm.sa" required>
    <p class="note">Logins look like <b class="mono">${esc(todo[0].kind === "store" ? todo[0].value.toLowerCase() : slug(todo[0].value))}@trackit.halfm.sa</b>. No emails are sent to these addresses.</p>
    <div class="err" id="berr"></div><div id="bprog"></div>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="bbtn">Create ${todo.length} logins</button></div></form>`);
  $("#bf").onsubmit = async ev => {
    ev.preventDefault(); const dom = new FormData(ev.target).get("domain").trim().replace(/^@/, "").toLowerCase();
    if (!/^[a-z0-9.-]+\.[a-z]{2,}$/.test(dom)) return $("#berr").textContent = "Enter an email ending like trackit.halfm.sa";
    $("#bbtn").disabled = true; let made = 0; const fails = [];
    for (let i = 0; i < todo.length; i += 20) {
      $("#bprog").innerHTML = `<p class="note">Creating ${Math.min(i + 20, todo.length)} of ${todo.length}…</p>`;
      const items = todo.slice(i, i + 20).map(t => ({ ...t, email: `${t.kind === "store" ? t.value.toLowerCase() : slug(t.value)}@${dom}`, password: genPw() }));
      const { data, error } = await sb.functions.invoke("trackit-admin-users", { body: { action: "bulk_create", items } });
      if (error || !data?.results) { fails.push(...items.map(x => [x.full_name, data?.error || error?.message || "failed"])); continue; }
      for (const r of data.results) { if (r.ok) made++; else fails.push([items.find(x => x.value === r.value)?.full_name || r.value, r.error]); }
    }
    await loadAdmin(); render();
    modal(`<h3>${made} logins created</h3><p class="note">Use <b>Download logins (Excel)</b> on the Users page whenever you need to share them.</p>
      ${fails.length ? `<div class="errlist">${fails.map(([c, e]) => `<div>${esc(c)}: ${esc(e)}</div>`).join("")}</div>` : ""}
      <div class="actions">${made ? `<button class="btn ghost" onclick="downloadLogins()">Download logins (Excel)</button>` : ""}<button class="btn" onclick="closeModal()">Done</button></div>`);
  };
}
async function downloadLogins(){

    const c = S.creds[p.id], m = p.scope_kind === "store" ? S.map[p.scope_value] : null;
    return [p.scope_kind === "store" ? "Store" : p.scope_kind === "dept" ? "Department" : "Other", p.scope_kind === "store" ? (m?.branch || p.scope_value) : p.scope_value, p.scope_kind === "store" ? p.scope_value : "", m?.area_manager || "", m?.city || "", c.login, c.password];
  }).sort((x, y) => x[0].localeCompare(y[0]) || x[1].localeCompare(y[1]));
  const link = location.origin + location.pathname;
  const ws = XLSX.utils.aoa_to_sheet([["Type", "Store / Department", "Code", "Area manager", "City", "Login email", "Password", "Website"], ...rows.map(r => [...r, link])]);

}

// ================= Trackit motion layer =================
// Crisp, purposeful motion: transform/opacity only, < 300ms for UI, little motion on frequent actions.
(function(){
  const mq = q => window.matchMedia && matchMedia(q).matches;
  const calm = mq("(prefers-reduced-motion: reduce)");
  const finePointer = mq("(hover: hover) and (pointer: fine)");

  // ambient background (decorative, very slow)
  const amb = document.createElement("div"); amb.className = "ambient"; amb.setAttribute("aria-hidden", "true");
  amb.innerHTML = "<i></i><i></i><i></i>"; document.body.prepend(amb);

  // toast: CSS transitions so a new toast can interrupt the old one smoothly
  let toastTimer = null;
  window.toast = function(msg){
    let t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); t.offsetWidth; }
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.classList.remove("show"); setTimeout(() => { if (!t.classList.contains("show")) t.remove(); }, 320); }, 2400);
  };

  // loading skeleton while data arrives
  const skeleton = () => `<div style="height:34px;width:220px;margin-bottom:8px" class="skel"></div><div style="height:16px;width:320px;margin-bottom:24px" class="skel"></div>
    <div class="kpis k5">${"<div class='skel' style='height:112px'></div>".repeat(5)}</div><div class="skel" style="height:300px"></div>`;
  const origLoadAll = window.loadAll;
  window.loadAll = async function(){
    const m = document.getElementById("main");
    if (m && !S.emps.length && !m.children.length) m.innerHTML = skeleton();
    return origLoadAll.apply(this, arguments);
  };

  // sliding indicator using FLIP (transform only): size it to the new item, then animate from the old box
  const last = {};
  function slide(container, key, activeSel){
    if (!container) return;
    const active = container.querySelector(activeSel);
    let ind = container.querySelector(":scope > .ind");
    if (!active) { if (ind) ind.style.opacity = 0; return; }
    if (!ind) { ind = document.createElement("span"); ind.className = "ind"; container.prepend(ind); }
    const box = { x: active.offsetLeft, y: active.offsetTop, w: active.offsetWidth, h: active.offsetHeight };
    const prev = last[key];
    ind.classList.toggle("done", active.classList.contains("done"));
    ind.classList.remove("go");
    Object.assign(ind.style, { opacity: 1, width: box.w + "px", height: box.h + "px" });
    if (prev && !calm && (prev.x !== box.x || prev.y !== box.y)) {
      ind.style.transform = `translate(${prev.x}px,${prev.y}px) scale(${prev.w / box.w},${prev.h / box.h})`;
      ind.offsetWidth; ind.classList.add("go");
    }
    ind.style.transform = `translate(${box.x}px,${box.y}px)`;
    last[key] = box;
  }
  function indicators(){
    slide(document.getElementById("nav"), "nav", "button.on");
    document.querySelectorAll("#main .tabs").forEach((t, i) => slide(t, "tabs" + i, "button.on"));
    document.querySelectorAll(".seg").forEach((t, i) => slide(t, "seg" + (t.dataset.name || i), "button.on"));
  }
  document.addEventListener("click", e => {
    const b = e.target.closest(".seg button");
    if (b) requestAnimationFrame(() => slide(b.parentElement, "seg" + (b.parentElement.dataset.name || "x"), "button.on"));
  });

  // count-up: only the first time the dashboard is shown in a visit (a rare, first-time moment)
  let counted = false;
  function countUp(el){
    const target = parseInt(String(el.textContent).replace(/[^\d]/g, ""), 10);
    if (!target) return;
    const t0 = performance.now(), dur = 700;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      el.textContent = Math.round(target * e).toLocaleString();
      if (p < 1) requestAnimationFrame(step);
    };
    el.textContent = "0"; requestAnimationFrame(step);
  }

  // reveal lower sections as they scroll into view
  const io = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { rootMargin: "0px 0px -6% 0px" }) : null;

  const ARROW = /^(See all alerts|Go to dashboard|Update|Save|Create login|Add employee|\+ Add employee|Upload another file|Download template|Download current list)$/;
  const seen = new Set();
  let lastView = null, alarmShown = false;
  function after(fromLive){
    indicators();
    const main = document.getElementById("main"); if (!main) return;
    document.querySelectorAll(".btn").forEach(b => { if (ARROW.test(b.textContent.trim())) b.classList.add("arrow"); });
    const impState = String(!!S.imp) + String(!!(S.imp && S.imp.result));
    const entering = S.view !== lastView || (S.view === "import" && !fromLive && main.dataset.imp !== impState);
    main.dataset.imp = impState; lastView = S.view;
    if (!entering || fromLive) return;
    const first = !seen.has(S.view); seen.add(S.view);
    // short, staggered entrance (fade-only for reduced motion via CSS)
    main.classList.remove("enter", "first"); void main.offsetWidth;
    main.classList.add("enter"); if (first) main.classList.add("first");
    [...main.children].forEach((c, i) => {
      if (i < 4) c.style.setProperty("--i", i);
      else if (io && first) { c.classList.add("reveal"); io.observe(c); }
    });
    if (first) main.querySelectorAll("tbody").forEach(tb => [...tb.children].slice(0, 8).forEach((r, i) => r.style.setProperty("--r", i)));
    // Expired card glows a few times on the first dashboard view only
    if (S.view === "dashboard" && !alarmShown) {
      main.querySelectorAll(".kpi").forEach(k => { if (/quick\('exp'\)/.test(k.getAttribute("onclick") || "") && parseInt(k.querySelector(".v").textContent.replace(/\D/g, ""), 10) > 0) { k.classList.add("alarm"); alarmShown = true; } });
    }
    if (S.view === "dashboard" && !counted && !calm) { counted = true; main.querySelectorAll(".kpi .v").forEach(countUp); }
    setTimeout(() => main.classList.remove("enter", "first"), 900);
  }
  const origRender = window.render;
  window.render = function(fromLive){ const r = origRender.apply(this, arguments); after(fromLive); return r; };
  window.addEventListener("resize", () => { for (const k in last) delete last[k]; indicators(); });

  // water-drop ripple: a soft splash plus an expanding ring from the exact click point
  document.addEventListener("pointerdown", e => {
    if (calm) return;
    const el = e.target.closest(".btn, nav button, .bottom-nav button, .tabs button, .seg button, .kpi, .chips button");
    if (!el || el.disabled) return;
    const r = el.getBoundingClientRect(), size = Math.min(Math.max(r.width, r.height) * 1.6, 260);
    const dark = el.matches(".btn:not(.ghost):not(.tan), nav button, .bottom-nav button");
    const color = dark ? "rgba(245,237,227,.55)" : "rgba(169,135,95,.32)";
    if (getComputedStyle(el).position === "static") el.style.position = "relative";
    ["", "ring"].forEach(kind => {
      const s = document.createElement("span"); s.className = "ripple" + (kind ? " " + kind : "");
      Object.assign(s.style, { width: size + "px", height: size + "px", left: (e.clientX - r.left - size / 2) + "px", top: (e.clientY - r.top - size / 2) + "px" });
      s.style.setProperty("--rc", color);
      el.appendChild(s); s.offsetWidth; s.classList.add("go"); setTimeout(() => s.remove(), 750);
    });
  });

  // soft spotlight following the mouse on KPI cards (mouse users only)
  if (finePointer && !calm) document.addEventListener("pointermove", e => {
    const k = e.target.closest && e.target.closest(".kpi"); if (!k) return;
    const r = k.getBoundingClientRect();
    k.style.setProperty("--mx", (e.clientX - r.left) + "px"); k.style.setProperty("--my", (e.clientY - r.top) + "px");
  }, { passive: true });

  // filter bar turns to glass once it sticks while scrolling
  document.addEventListener("scroll", () => {
    const main = document.getElementById("main"), f = main && main.querySelector(".filters"); if (!f) return;
    f.classList.toggle("stuck", main.scrollTop > 80 && f.getBoundingClientRect().top - main.getBoundingClientRect().top <= parseFloat(getComputedStyle(main).paddingTop) + parseFloat(getComputedStyle(f).top) + 2);
  }, { passive: true, capture: true });
})();

</script>
</body>
