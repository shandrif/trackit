<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trackit · Baladiya Card Tracker</title>
<meta name="description" content="Track staff Baladiya health card renewals across Half Million stores.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23111'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%23F5EDE3'%3E½M%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F5EDE3; --card:#FFFDF9; --ink:#111111; --muted:#6E655B; --line:#E4D7C5;
  --tan:#D4B38B; --tan-d:#A9875F; --teal:#84C6B2; --teal-d:#2F8A72;
  --red:#C2412D; --red-bg:#F8E1DB; --amber:#A8691C; --amber-bg:#F7E6CC; --ok-bg:#DDF0EA;
  --radius:16px; --shadow:0 1px 0 rgba(17,17,17,.04),0 8px 24px -12px rgba(80,56,30,.18);
  --font:"Frutiger LT Arabic","Frutiger LT","Frutiger","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
/* logo */
.logo{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.5px;flex:none}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-size:20px;letter-spacing:-.3px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 30px;box-shadow:var(--shadow)}
.login-card h1{font-size:26px;margin:22px 0 6px;letter-spacing:-.4px}
.login-card p{color:var(--muted);margin:0 0 22px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--tan-d);box-shadow:0 0 0 3px rgba(212,179,139,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 18px;font-weight:600;cursor:pointer;min-height:44px;background:var(--ink);color:var(--bg);white-space:nowrap}
.btn:hover{background:#2a2622}
.btn.tan{background:var(--tan);color:var(--ink)} .btn.tan:hover{background:#c9a476}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.w100{width:100%}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
/* shell */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--ink);color:var(--bg);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside .logo{background:var(--bg);color:var(--ink)}
aside .brand small{color:#bfb3a3}
nav{margin-top:26px;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#d9cfc2;padding:11px 12px;border-radius:11px;cursor:pointer;text-align:left;font-weight:500}
nav button:hover{background:#26221e;color:#fff}
nav button.on{background:var(--tan);color:var(--ink);font-weight:700}
nav button svg{width:19px;height:19px;flex:none}
nav .sep{font-size:11px;letter-spacing:.12em;color:#8f8476;margin:16px 12px 4px;text-transform:uppercase}
.me{margin-top:auto;border-top:1px solid #2c2722;padding-top:14px;font-size:13px}
.me b{display:block;color:#fff;font-size:14px}
.me span{color:#bfb3a3}
.me button{margin-top:10px;background:transparent;border:1px solid #3a342e;color:#d9cfc2;border-radius:9px;padding:7px 12px;cursor:pointer}
main{padding:28px 32px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h2{margin:0;font-size:28px;letter-spacing:-.5px}
.top p{margin:4px 0 0;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--teal-d);background:var(--ok-bg);padding:5px 10px;border-radius:999px;font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:var(--teal-d);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:18px 20px;cursor:pointer;transition:transform .12s}
.kpi:hover{transform:translateY(-2px)}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .v{font-size:38px;font-weight:700;letter-spacing:-1px;margin-top:6px;line-height:1}
.kpi .s{font-size:12px;color:var(--muted);margin-top:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
h3{margin:0 0 14px;font-size:17px}
.bar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:#efe5d8;margin:6px 0 12px}
.bar span{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink)}
/* table */
.tbl-wrap{overflow:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:#FBF6EF;position:sticky;top:0;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #EFE5D8;vertical-align:middle}
tr:last-child td{border-bottom:0}
td .sub{color:var(--muted);font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-exp{background:var(--red-bg);color:var(--red)} .p-due{background:var(--amber-bg);color:var(--amber)} .p-ok{background:var(--ok-bg);color:var(--teal-d)}
.icon-btn{background:transparent;border:0;border-radius:8px;padding:6px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:#f1e7da;color:var(--ink)}
.icon-btn svg{width:17px;height:17px;display:block}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters > *{flex:1 1 160px;max-width:260px}
.filters input[type=search]{flex:2 1 240px;max-width:none}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);gap:10px;flex-wrap:wrap}
.empty{padding:42px 20px;text-align:center;color:var(--muted)}
.tabs{display:inline-flex;background:#EADFD0;border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.step-n{width:34px;height:34px;border-radius:10px;background:var(--tan);display:grid;place-items:center;font-weight:700;margin-bottom:12px}
.drop{border:2px dashed var(--tan);border-radius:14px;padding:26px;text-align:center;background:#FBF6EF;cursor:pointer}
.drop.over{background:#f3e6d4}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.summary div{background:#FBF6EF;border-radius:12px;padding:12px;text-align:center}
.summary b{display:block;font-size:24px}
.errlist{max-height:240px;overflow:auto;font-size:13px;background:var(--red-bg);border-radius:12px;padding:12px 14px;color:#7a2a1d}
.note{font-size:13px;color:var(--muted)}
code{background:#EFE5D8;padding:1px 6px;border-radius:6px;font-size:12.5px}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 170px);min-height:420px}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:12px 15px;border-radius:14px;white-space:normal}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#FBF6EF;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a ul{margin:6px 0;padding-left:20px}
.msg.a p{margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;font-size:13px}
.chips button:hover{border-color:var(--tan-d)}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.typing{color:var(--muted);font-size:13px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:100%;max-width:480px;background:var(--card);border-radius:20px;padding:24px;max-height:92vh;overflow:auto}
.modal h3{font-size:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;font-weight:600;box-shadow:var(--shadow)}
.mobile-top,.bottom-nav{display:none}
.sm-only{display:none}
.sub.sm-only{display:none}
td.mono{white-space:nowrap}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:18px 16px 96px}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--ink);color:var(--bg);position:sticky;top:0;z-index:20}
  .mobile-top .logo{background:var(--bg);color:var(--ink);width:34px;height:34px;font-size:13px}
  .mobile-top button{background:transparent;border:1px solid #3a342e;color:#d9cfc2;border-radius:9px;padding:6px 10px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottom-nav button{background:transparent;border:0;color:#bfb3a3;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;padding:6px 4px;border-radius:10px;flex:1;cursor:pointer}
  .bottom-nav button.on{color:var(--tan)}
  .bottom-nav svg{width:21px;height:21px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.steps{grid-template-columns:1fr}
  .kpi .v{font-size:30px}
  .top h2{font-size:23px}
  .msg{max-width:92%}
  .summary{grid-template-columns:repeat(2,1fr)}
  .row2{grid-template-columns:1fr}
  .filters > *{max-width:none}
  .hm{display:none}
  .sm-only{display:inline}
  .sub.sm-only{display:block}
  td,th{padding:10px 10px}
  .chat{height:calc(100vh - 290px);min-height:360px}
  .pill{font-size:11px;padding:3px 8px}
}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.p-miss{background:#ECE6DE;color:#5C554C}
.prog{display:inline-flex;gap:4px;align-items:center}
.prog i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:#EFE5D8;color:#9b8f80}
.prog i.on{background:var(--teal);color:#0f3b30}
.prog i.na{background:#F3EEE7;color:#b9ad9e;text-decoration:line-through}
.funnel{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:150px 1fr 54px;gap:12px;align-items:center;font-size:14px}
.frow .track{height:14px;border-radius:999px;background:#efe5d8;overflow:hidden}
.frow .track span{display:block;height:100%;border-radius:999px}
.frow b{text-align:right;font-variant-numeric:tabular-nums}
.trend svg{width:100%;height:auto;display:block}
.seg{display:inline-flex;background:#EFE5D8;border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;color:var(--muted);font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.done{background:var(--teal);color:#0f3b30}
.steprow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EFE5D8;flex-wrap:wrap}
.steprow:last-child{border-bottom:0}
.modal.wide{max-width:640px}
.matchtbl td{padding:8px 10px}
.matchtbl select{min-height:38px;padding:7px 10px}
.okbox{background:var(--ok-bg);color:#1f5e4e;border-radius:12px;padding:12px 14px;font-size:13px}
.warnbox{background:var(--amber-bg);color:#6e4310;border-radius:12px;padding:12px 14px;font-size:13px}
.section{margin-top:16px}
.contact a{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--muted);text-decoration:none}
.contact a:hover{background:#f1e7da;color:var(--ink)}
.contact svg{width:17px;height:17px}
@media (max-width:900px){
  .kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .frow{grid-template-columns:110px 1fr 40px;font-size:13px}
  .modal.wide{max-width:100%}
  div.sm-only{display:block}
  td.mono{white-space:normal}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <div class="brand"><div class="logo">½M</div><div><b>Trackit</b><small>Baladiya card tracker</small></div></div>

<div id="noaccess" class="hidden" style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <div class="login-card"><div class="brand"><div class="logo">½M</div><div><b>Trackit</b></div></div>
  <h1>No access yet</h1><p>Your login works, but it hasn't been added to Trackit. Ask the admin to add you.</p>
  <button class="btn" onclick="signOut()">Sign out</button></div>
</div>

<!-- APP -->
<div id="shell" class="hidden">
<div class="mobile-top"><div class="brand"><div class="logo">½M</div><b>Trackit</b></div><button onclick="signOut()">Sign out</button></div>
<div id="app">
  <aside>
    <div class="brand"><div class="logo">½M</div><div><b>Trackit</b><small>Baladiya card tracker</small></div></div>
    <nav id="nav"></nav>
    <div class="me"><b id="meName"></b><span id="meRole"></span><br><button onclick="signOut()">Sign out</button></div>
  </aside>
  <main id="main"></main>
</div>
<div class="bottom-nav" id="bnav"></div>
</div>

<script>
// ---------- config ----------
const SUPABASE_URL = "https://rcufmnidwyycbrtqgqga.supabase.co";
const SUPABASE_KEY = "sb_publishable_u2__PPq2nDZLyoNnLHxkVA_olltjpHc";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DUE_DAYS = 30;
const REGIONS = ["Riyadh","Western","Eastern","North","South"];
const NATIONALITIES = ["Saudi","Bangladeshi","Indian","Filipino","Pakistani","Nepali","Egyptian","Sudanese","Yemeni","Eritrean","Sri Lankan","Jordanian","Syrian","Other"];
const COLS = ["Employee ID","Name","Store","Region","Iqama Number","Nationality","Expiry Date","Mobile Number","AM Remarks"];

// ---------- state ----------
const S = { me:null, emps:[], weeks:[], profiles:[], view:"dashboard", page:1, filters:{q:"",region:"",store:"",status:""}, alertTab:"exp", chat:[], channel:null, imp:null };

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayUTC = () => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); };
const daysLeft = d => Math.round((Date.parse(d) - todayUTC()) / 86400000);
const statusOf = e => { if (!e.expiry) return "miss"; const n = daysLeft(e.expiry); return n < 0 ? "exp" : n <= DUE_DAYS ? "due" : "ok"; };
const STATUS_LABEL = { exp:"Expired", due:"Due ≤ 30 days", miss:"Date missing", ok:"OK" };
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = d => { if(!d) return ""; const [y,m,dd] = d.split("-"); return `${dd} ${MONTHS[+m-1]} ${y}`; };
const relDays = d => { const n = daysLeft(d); return n < 0 ? `${-n} day${n===-1?"":"s"} ago` : n === 0 ? "today" : `in ${n} day${n===1?"":"s"}`; };
const pill = e => { const s = statusOf(e); return `<span class="pill p-${s}"><i></i>${STATUS_LABEL[s]}</span>`; };
const dateCell = e => e.expiry ? `${fmtDate(e.expiry)}<div class="sub">${relDays(e.expiry)}</div>` : `<div class="sub">${esc(e.expiry_note || "No date")}</div>`;
const isAdmin = () => S.me?.role === "admin";
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function phoneIntl(m){ let d = String(m||"").replace(/\D/g,""); if (!d) return ""; if (d.startsWith("00")) d = d.slice(2); if (d.startsWith("0")) d = d.slice(1); if (d.length === 9 && d.startsWith("5")) d = "966" + d; return d; }
function contact(e){
  const p = phoneIntl(e.mobile); if (!p) return "";
  return `<span class="contact"><a href="tel:+${p}" title="Call" aria-label="Call">${ICON.phone}</a><a href="https://wa.me/${p}" target="_blank" rel="noopener" title="WhatsApp" aria-label="WhatsApp">${ICON.wa}</a></span>`;
}
const ICON = {
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.5 3.5 5.2"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',

async function pageAll(table, order){
  const rows = [];

    const { data, error } = await sb.from(table).select("*").order(order).range(from, from + 999);
    if (error) { toast(error.message); break; }
    rows.push(...data); if (data.length < 1000) break;
  }
  return rows;
}
async function loadAll(){

function trend(){
  const weeks = S.weeks.slice(-12);
  if (weeks.length < 2) return `<div class="card pad"><h3>Week by week</h3><p class="note">The trend appears after two weekly uploads${weeks.length ? ` (saved so far: ${esc(weeks[0].label)})` : ""}.</p></div>`;
  const W = 560, H = 210, P = { l:36, r:12, t:12, b:34 };
  const max = Math.max(1, ...weeks.flatMap(w => [w.expired, w.due, w.missing]));
  const x = i => P.l + i * (W - P.l - P.r) / (weeks.length - 1), y = v => P.t + (H - P.t - P.b) * (1 - v / max);
  const line = (k, col) => `<polyline fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" points="${weeks.map((w,i) => `${x(i)},${y(w[k])}`).join(" ")}"/>` + weeks.map((w,i) => `<circle cx="${x(i)}" cy="${y(w[k])}" r="3.5" fill="${col}"><title>${esc(w.label)}: ${w[k]}</title></circle>`).join("");
  const grid = [0, .5, 1].map(f => `<line x1="${P.l}" x2="${W-P.r}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#EFE5D8"/><text x="${P.l-6}" y="${y(max*f)+4}" text-anchor="end" font-size="11" fill="#6E655B">${Math.round(max*f)}</text>`).join("");
  const labels = weeks.map((w,i) => `<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#6E655B">${esc(w.label.replace(/^week\s*/i,"W").replace(/\s+\d{4}$/,""))}</text>`).join("");
  return `<div class="card pad trend"><h3>Week by week</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Expired, due and missing-date counts by week">${grid}${line("expired","#C2412D")}${line("due","#A9875F")}${line("missing","#9b8f80")}${labels}</svg>
  <div class="legend" style="margin-top:6px"><span><span class="dot" style="background:#C2412D"></span> Expired</span><span><span class="dot" style="background:#A9875F"></span> Due ≤ 30 days</span><span><span class="dot" style="background:#9b8f80"></span> No date</span></div></div>`;
}

function downloadCSV(name, rows){

// ---------- import: reading files ----------
const normHead = h => String(h||"").toLowerCase().replace(/\s+/g," ").trim();
const HEAD = {
  employee_id: ["employee id","employee number","employee no","emp no","emp id","staff id"],
  name: ["name","employee name","full name"],
  store: ["store","branch","store name","branch name"],
  region: ["region"],
  iqama: ["iqama number","iqama","iqama no"],
  nationality: ["nationality"],
  expiry: ["expiry date","expire date","expired date","expiration date","expiry","expire"],
  mobile: ["mobile number","phone number","mobile","phone","mobile no"],
  remarks: ["am remarks","am- remarks","am-remarks","remarks","remark","reamrk"],
};
function colIndex(head){ const idx = {}; for (const [k, names] of Object.entries(HEAD)) { idx[k] = head.findIndex(h => names.includes(h)); if (idx[k] < 0) idx[k] = head.findIndex(h => names.some(n => h.startsWith(n))); } return idx; }
const MONTH_IX = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
function validYMD(y, m, d){ const dt = new Date(Date.UTC(y, m-1, d)); return dt.getUTCFullYear() === y && dt.getUTCMonth() === m-1 && dt.getUTCDate() === d; }
const ymd = (y, m, d) => `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
function readDate(v){
  if (v === null || v === undefined || String(v).trim() === "") return { date:"", note:"Blank in file", unclear:false };
  if (v instanceof Date && !isNaN(v)) return check(v.getFullYear(), v.getMonth()+1, v.getDate(), String(v));
  if (typeof v === "number") { const d = XLSX.SSF.parse_date_code(v); return d ? check(d.y, d.m, d.d, String(v)) : { date:"", note:String(v), unclear:true }; }
  const s = String(v).trim(), u = s.toUpperCase();
  if (/^0+[-/ ]+(JAN|0+)[-/ ]+0+$/i.test(s)) return { date:"", note:s, unclear:false };
  if (/^(NOT\s*FOUND|N\/?A|NA|NOT\s*UPDATED|NONE|NIL|-+|PENDING|TBA|TBC)$/.test(u)) return { date:"", note:s, unclear:false };
  let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return check(+m[1], +m[2], +m[3], s);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/))) return check(fixYear(+m[3]), +m[2], +m[1], s);
  if ((m = s.match(/^([A-Za-z]{3,9})[\s\-.]*(\d{1,2})(?:st|nd|rd|th)?[\s,\-.]*(\d{2,4})$/))) { const mo = MONTH_IX[m[1].toLowerCase().slice(0,3)]; if (mo) return check(fixYear(+m[3]), mo, +m[2], s); }
  if ((m = s.match(/^(\d{1,2})(?:st|nd|rd|th)?[\s\-.]*([A-Za-z]{3,9})[\s,\-.]*(\d{2,4})$/))) { const mo = MONTH_IX[m[2].toLowerCase().slice(0,3)]; if (mo) return check(fixYear(+m[3]), mo, +m[1], s); }
  return { date:"", note:s, unclear:true };
  function fixYear(y){ return y < 100 ? 2000 + y : y; }
  function check(y, mo, d, raw){
    if (y >= 1400 && y <= 1500) return { date:"", note:`${raw} (Hijri? please check)`, unclear:true };
    if (!validYMD(y, mo, d) || y < 2015 || y > 2040) return { date:"", note:raw, unclear:true };
    return { date: ymd(y, mo, d), note:"", unclear:false };
  }
}
function normNationality(v){
  const u = String(v||"").toUpperCase().replace(/[^A-Z ]/g,"").trim(); if (!u) return "";
  const map = [[/^SAUDI/,"Saudi"],[/^BANGLA/,"Bangladeshi"],[/^IND(I)?AN|^INDIA/,"Indian"],[/^FILIP|^PHIL|^PHIP|^PILIP/,"Filipino"],[/^PAKIS/,"Pakistani"],[/^NEPAL/,"Nepali"],[/^EGYP/,"Egyptian"],[/^SUDAN/,"Sudanese"],[/^YEMEN/,"Yemeni"],[/^ERIT|^IRIT/,"Eritrean"],[/^SRI ?LANK/,"Sri Lankan"],[/^JORDAN/,"Jordanian"],[/^SYRI/,"Syrian"],[/^NONE$/,""]];
  for (const [re, n] of map) if (re.test(u)) return n;
  return "Other";
}
function normRegion(v){
  const u = String(v||"").trim().toLowerCase(); if (!u) return "";
  return REGIONS.find(r => r.toLowerCase() === u || u.startsWith(r.toLowerCase().slice(0,4))) || String(v).trim();
}
function normMobile(v){ return String(v||"").replace(/\D/g,"").replace(/^(00)?966/, "").replace(/^0+/, ""); }
async function readWorkbook(file){
  const wb = XLSX.read(await file.arrayBuffer(), { type:"array", cellDates:true });
  const rows = []; const sheets = [];
  for (const name of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:"", raw:true });
    let h = -1; for (let i = 0; i < Math.min(aoa.length, 8); i++) { const t = aoa[i].map(normHead); if (t.some(x => HEAD.employee_id.includes(x)) && t.some(x => HEAD.store.includes(x))) { h = i; break; } }
    if (h < 0) { sheets.push({ name, rows:0, skipped:true }); continue; }
    const idx = colIndex(aoa[h].map(normHead));
    let n = 0;
    aoa.slice(h + 1).forEach((r, i) => {
      if (r.every(c => String(c).trim() === "")) return;
      const get = k => idx[k] >= 0 ? r[idx[k]] : "";
      const eid = String(get("employee_id")).trim().replace(/\.0$/, ""); const nm = String(get("name")).trim();
      if (!eid && !nm) return;
      const d = readDate(get("expiry"));
      rows.push({ where: `${name.trim()} row ${h + i + 2}`, employee_id: eid, name: nm.replace(/\s+/g," "), store: String(get("store")).replace(/\s+/g," ").trim(),
        region: normRegion(get("region")), iqama: String(get("iqama")).trim().replace(/\.0$/, ""), nationality: normNationality(get("nationality")),
        mobile: normMobile(get("mobile")), expiry: d.date, expiry_note: d.note, unclear: d.unclear, remarks: String(get("remarks") ?? "").replace(/\s+/g," ").trim() });
      n++;
    });
    sheets.push({ name, rows:n });
  }
  return { rows, sheets };
}
function analyse(rows){
  const byId = {}; rows.forEach((r, i) => { (byId[r.employee_id] ??= []).push(i); });
  const exactDup = [], conflicts = [];
  for (const [id, ix] of Object.entries(byId)) {
    if (!id || ix.length < 2) continue;
    const sig = i => [rows[i].store.toUpperCase(), rows[i].expiry || rows[i].expiry_note, rows[i].name.toUpperCase()].join("|");
    if (new Set(ix.map(sig)).size === 1) exactDup.push(id); else conflicts.push({ id, rows: ix.map(i => rows[i]) });
  }
  return { exactDup, conflicts };
}
function weekLabelFor(fileName){
  const wk = (fileName.match(/week[\s_\-]*(\d{1,2})/i) || [])[1];
  if (wk) return `Week ${wk} ${new Date().getFullYear()}`;
  const d = new Date(); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  return `Week ${Math.ceil(((t - Date.UTC(t.getUTCFullYear(),0,1)) / 86400000 + 1) / 7)} ${t.getUTCFullYear()}`;
}

function importView(){
  if (S.imp) return S.imp.result ? importResult() : importPreview();
  return header("Import", "Upload the weekly Baladiya file") + `
  <div class="steps">
    <div class="card pad"><div class="step-n">1</div><h3>Use the Trackit template</h3>

      ${S.emps.length ? `<button class="btn ghost" onclick="downloadTemplate(true)">Download current list</button>` : ""}</div>
    </div>
    <div class="card pad"><div class="step-n">2</div><h3>Upload</h3>
      <p class="note">You'll see a check before anything is saved: duplicates, unclear dates and missing store or region.</p>

    </div>

}
function downloadTemplate(withData){
  const data = withData ? S.emps.map(e => { const r = empRow(e); r[6] = e.expiry ? new Date(e.expiry + "T00:00:00") : ""; return r; }) : [];
  const ws = XLSX.utils.aoa_to_sheet([COLS, ...data], { cellDates:true });
  ws["!cols"] = [16,30,26,12,16,14,14,16,40].map(w => ({ wch:w }));
  for (let i = 1; i <= data.length; i++) { const c = ws[XLSX.utils.encode_cell({ r:i, c:6 })]; if (c && c.t === "d") c.z = "dd-mmm-yyyy"; }
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Employees");
  XLSX.writeFile(wb, withData ? `trackit-current-list-${new Date().toISOString().slice(0,10)}.xlsx` : "trackit-template.xlsx");
}
function bindDrop(){
  const d = $("#drop"), f = $("#file"); if (!d) return;
  f.onchange = () => f.files[0] && handleFile(f.files[0]);
  d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
  d.ondragleave = () => d.classList.remove("over");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); e.dataTransfer.files[0] && handleFile(e.dataTransfer.files[0]); };
}
async function handleFile(file){
  $("#impOut").innerHTML = `<p class="note" style="margin-top:14px">Reading ${esc(file.name)}…</p>`;
  try {
    const { rows, sheets } = await readWorkbook(file);
    if (!rows.length) throw new Error("No employee rows found. The sheet needs headings like Employee ID, Name and Store — use the Trackit template.");
    S.imp = { file: file.name, rows, sheets, ...analyse(rows), week: weekLabelFor(file.name), result: null };
    render();
  } catch (e) { $("#impOut").innerHTML = `<div class="errlist" style="margin-top:14px">${esc(e.message || e)}</div>`; $("#file").value = ""; }
}
function importPreview(){
  const I = S.imp;
  const unclear = I.rows.filter(r => r.unclear), missing = I.rows.filter(r => !r.expiry && !r.unclear).length;
  const noStore = I.rows.filter(r => !r.store), noRegion = I.rows.filter(r => !r.region), odd = I.rows.filter(r => r.region && !REGIONS.includes(r.region));
  const listRows = (rows, cell) => `<div class="tbl-wrap section"><table><thead><tr><th>Where</th><th>Employee</th><th>File says</th></tr></thead><tbody>${rows.slice(0,100).map(r => `<tr><td>${esc(r.where)}</td><td>${esc(r.name)}</td><td>${esc(cell(r))}</td></tr>`).join("")}</tbody></table></div>`;
  const good = !I.conflicts.length && !unclear.length && !noStore.length && !noRegion.length && !odd.length;
  return header("Check before saving", `${esc(I.file)} · ${I.rows.length} rows`, `<button class="btn ghost" onclick="S.imp=null;render()">Cancel</button>`) + `
  ${I.sheets.filter(s => !s.skipped).length > 1 ? `<div class="card pad"><h3>Sheets</h3><p class="note">${I.sheets.map(s => `${esc(s.name.trim())}: ${s.skipped ? "skipped" : `<b>${s.rows}</b> rows`}`).join(" · ")}</p></div>` : ""}
  ${good ? `<div class="okbox section">Everything looks clean.</div>` : ""}
  <div class="card pad section"><h3>Duplicates</h3>
    ${!I.exactDup.length && !I.conflicts.length ? `<div class="okbox">No duplicate Employee IDs.</div>` : ""}
    ${I.exactDup.length ? `<p class="note">${I.exactDup.length} Employee IDs appear twice with identical details — merged automatically.</p>` : ""}
    ${I.conflicts.length ? `<div class="warnbox">${I.conflicts.length} Employee IDs appear more than once with <b>different</b> details. The <b>last row</b> will be used:</div>
      <div class="tbl-wrap section"><table><thead><tr><th>Employee ID</th><th>Rows in file</th></tr></thead><tbody>${I.conflicts.map(c => `<tr><td class="mono">${esc(c.id)}</td><td>${c.rows.map(r => `${esc(r.where)}: ${esc(r.store)} · ${esc(r.expiry || r.expiry_note)}`).join("<br>")}</td></tr>`).join("")}</tbody></table></div>` : ""}
  </div>
  <div class="card pad section"><h3>Dates</h3>
    <p class="note"><b>${I.rows.filter(r => r.expiry).length}</b> rows have a date. <b>${missing}</b> have no date (blank, N/A, NOT FOUND) and will show as <b>Date missing</b>.</p>
    ${unclear.length ? `<div class="warnbox">${unclear.length} dates couldn't be read and will be saved as <b>Date missing</b>:</div>${listRows(unclear, r => r.expiry_note)}` : ""}
  </div>
  ${noStore.length || noRegion.length || odd.length ? `<div class="card pad section"><h3>Store and region</h3>
    ${noStore.length ? `<div class="warnbox">${noStore.length} rows have no store.</div>${listRows(noStore, () => "(blank)")}` : ""}
    ${noRegion.length ? `<div class="warnbox section">${noRegion.length} rows have no region. They'll show under "—" until you fill it in.</div>` : ""}
    ${odd.length ? `<div class="warnbox section">${odd.length} rows have a region that isn't one of ${REGIONS.join(", ")}: ${[...new Set(odd.map(r => r.region))].map(esc).join(", ")}</div>` : ""}
  </div>` : ""}
  <div class="card pad section"><h3>Save</h3>
    <label>Save this upload as</label><input type="text" id="weekLabel" value="${esc(I.week)}" style="max-width:320px">
    <p class="note">This week's totals are kept for the week-by-week chart.</p>
    <div class="actions" style="justify-content:flex-start"><button class="btn" id="impBtn" onclick="runImport()">Save ${new Set(I.rows.map(r => r.employee_id)).size} employees</button></div>
    <div id="impProg"></div>
  </div>`;
}
async function runImport(){
  const I = S.imp; $("#impBtn").disabled = true;
  try {
    const last = new Map(); I.rows.forEach(r => last.set(r.employee_id || r.where, r));
    const rows = [...last.values()].map(r => ({ row: r.where, employee_id: r.employee_id, name: r.name, store: r.store, region: r.region, iqama: r.iqama,
      nationality: r.nationality, mobile: r.mobile, expiry: r.expiry, expiry_note: r.expiry_note, remarks: r.remarks }));
    const label = ($("#weekLabel")?.value || I.week).trim();
    const tot = { added:0, updated:0, skipped:0, errors:[], week: label };
    for (let i = 0; i < rows.length; i += 500) {
      $("#impProg").innerHTML = `<p class="note">Saving ${Math.min(i + 500, rows.length)} of ${rows.length}…</p>`;
      const isLast = i + 500 >= rows.length;
      const { data, error } = await sb.rpc("trackit_import_v3", { rows: rows.slice(i, i + 500), week_label: isLast ? label : null });
      if (error) throw error;
      tot.added += data.added; tot.updated += data.updated; tot.skipped += data.skipped; tot.errors.push(...data.errors);
    }
    I.result = tot; await loadAll(); render(); toast("Import finished");
  } catch (e) { $("#impProg").innerHTML = `<div class="errlist">${esc(e.message || e)}</div>`; $("#impBtn").disabled = false; }
}
function importResult(){
  const t = S.imp.result;
  return header("Import finished", `${esc(S.imp.file)} · saved as ${esc(t.week)}`, `<button class="btn" onclick="S.imp=null;go('dashboard')">Go to dashboard</button>`) + `
  <div class="card pad"><div class="summary"><div><b style="color:var(--teal-d)">${t.added}</b>added</div><div><b style="color:var(--tan-d)">${t.updated}</b>updated</div><div><b>${t.skipped}</b>unchanged</div><div><b style="color:${t.errors.length?"var(--red)":"var(--muted)"}">${t.errors.length}</b>problems</div></div>
  ${t.errors.length ? `<div class="errlist">${t.errors.slice(0,300).map(e => `<div>${esc(e.row)}: ${esc(e.msg)}</div>`).join("")}</div>` : `<div class="okbox">Everything saved. Dashboards update for everyone automatically.</div>`}
  <div class="actions" style="justify-content:flex-start"><button class="btn ghost" onclick="S.imp=null;render()">Upload another file</button></div></div>`;
}

// ---------- assistant ----------
function md(t){
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\s)\*(?!\s)(.+?)\*(?=\s|$)/g, "$1$2").replace(/^#+\s*/gm, "").split(/\n/);
  let h = "", inList = false;
  for (const l of lines) { const m = l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if (m) { if (!inList) { h += "<ul>"; inList = true; } h += `<li>${m[1]}</li>`; } else { if (inList) { h += "</ul>"; inList = false; } if (l.trim()) h += `<p>${l}</p>`; } }
  return h + (inList ? "</ul>" : "");
}
function assistant(){
  return header("AI Assistant", "Ask about Baladiya renewals in plain words") + `
  <div class="card chat"><div class="msgs" id="msgs"></div>
  <div class="chips" id="chips">${["Which store has the most expired cards?","Who expires this week?","Which region is doing worst?","Make a renewal plan for this week"].map(q => `<button onclick="ask(this.textContent)">${q}</button>`).join("")}</div>
  <form class="composer" onsubmit="event.preventDefault();ask($('#cq').value)"><input id="cq" type="text" placeholder="Ask about your employees…" autocomplete="off"><button class="btn">Send</button></form></div>
  <p class="note" style="margin-top:10px">The assistant sees names, stores, regions, dates and remarks — never Iqama or mobile numbers. Free AI has a daily limit.</p>`;
}
function afterChat(){
  const box = $("#msgs"); if (!box) return;
  box.innerHTML = S.chat.length ? S.chat.map(m => `<div class="msg ${m.role==="user"?"u":"a"}">${m.role==="user" ? esc(m.content) : md(m.content)}</div>`).join("")
    : `<div class="empty">Hi ${esc((S.me.full_name||"").split(" ")[0])}! Ask who needs a Baladiya renewal, which stores are behind, or for a plan.</div>`;
  if (S.busy) box.innerHTML += `<div class="typing">Thinking…</div>`;
  const chips = $("#chips"); if (chips) chips.style.display = S.chat.length ? "none" : "";
  box.scrollTop = box.scrollHeight;
}
async function ask(q){
  q = (q || "").trim(); if (!q || S.busy) return;
  S.chat.push({ role:"user", content:q }); S.busy = true; if ($("#cq")) $("#cq").value = ""; afterChat();
  const { data, error } = await sb.functions.invoke("trackit-ask", { body: { question: q, history: S.chat.slice(0, -1) } });
  S.busy = false;
  let msg = data?.answer;
  if (!msg) { let detail = data?.error; if (!detail && error?.context?.json) { try { detail = (await error.context.json()).error; } catch {} } msg = "Sorry — " + (detail || "the assistant isn't available right now."); }
  S.chat.push({ role:"assistant", content: msg });
  if (S.view === "assistant") afterChat();
}

// ---------- users (admin) ----------
async function adminCall(body){
  const { data, error } = await sb.functions.invoke("trackit-admin-users", { body });
  if (data?.ok) return null;
  let msg = data?.error; if (!msg && error?.context?.json) { try { msg = (await error.context.json()).error; } catch {} }
  return msg || error?.message || "Something went wrong";
}

  return header("Users", "Everyone with a login sees all employees. Only admins manage users and delete employees.", `<button class="btn" onclick="addLogin()">+ Add user</button>`) + `

}
function addLogin(){
  modal(`<h3>Add user</h3><form id="lf">
    <label>Full name</label><input type="text" name="full_name" required>
    <label>Email</label><input type="email" name="email" required>
    <label>Starting password (min 8 characters)</label><input type="text" name="password" required minlength="8" autocomplete="off">
    <label>Role</label><select name="role"><option value="manager">User — sees and updates all employees</option><option value="admin">Admin — also manages users</option></select>
    <div class="err" id="lerr2"></div>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="lbtn2">Create login</button></div></form>`);
  $("#lf").onsubmit = async ev => { ev.preventDefault(); $("#lbtn2").disabled = true;
    const err = await adminCall({ action:"create", ...Object.fromEntries(new FormData(ev.target)) });
    $("#lbtn2").disabled = false; if (err) return $("#lerr2").textContent = err;
    closeModal(); toast("Login created — share the password privately"); await loadAll(); render(); };
}
function resetPw(id){
  const m = S.profiles.find(x => x.id === id);
  modal(`<h3>Reset password</h3><p class="note">For ${esc(m.full_name || m.email)}</p><form id="rf"><label>New password (min 8 characters)</label><input type="text" name="password" required minlength="8" autocomplete="off">
  <div class="err" id="rerr"></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save password</button></div></form>`);
  $("#rf").onsubmit = async ev => { ev.preventDefault(); const err = await adminCall({ action:"reset_password", id, password: new FormData(ev.target).get("password") }); if (err) return $("#rerr").textContent = err; closeModal(); toast("Password updated"); };
}
function delLogin(id){
  const m = S.profiles.find(x => x.id === id);
  modal(`<h3>Remove login?</h3><p class="note">${esc(m.email)} won't be able to sign in. Employee data stays in Trackit.</p><div class="err" id="derr"></div>
  <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" id="dm">Remove</button></div>`);
  $("#dm").onclick = async () => { const err = await adminCall({ action:"delete", id }); if (err) return $("#derr").textContent = err; closeModal(); toast("Removed"); await loadAll(); render(); };
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
